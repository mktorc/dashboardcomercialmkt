name: Sincronizar comissões (HQ Rentals)

on:
  schedule:
    # 15:00 UTC = 12:00 em Brasília (o GitHub agenda sempre em UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: sync-comissoes-hq
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O script só precisa do supabase-js; evita instalar o projeto inteiro (o package-lock.json não é mantido).
      - run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix scripts/comissoes @supabase/supabase-js@2
      - run: node scripts/comissoes/importar-hq.mjs
        env:
          HQ_TENANT_TOKEN: ${{ secrets.HQ_TENANT_TOKEN }}
          HQ_USER_TOKEN: ${{ secrets.HQ_USER_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
