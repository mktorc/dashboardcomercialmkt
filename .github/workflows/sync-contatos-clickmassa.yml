name: Sincronizar contatos (ClickMassa)

on:
  schedule:
    # De hora em hora (minuto 22, fora dos minutos mais disputados e do sync de oportunidades):
    # atualiza crm_leads com as 50 primeiras páginas de contatos (os mais recentes). Se o GitHub
    # pular, o Monitor dos dados de precificação dispara esta rotina quando passa de 3 h sem rodar.
    - cron: '22 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-contatos-clickmassa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a sincronização de contatos
        env:
          SYNC_CRON_TOKEN: ${{ secrets.SYNC_CRON_TOKEN }}
        run: |
          curl --fail-with-body -sS -m 540 -X POST \
            "https://dashboardcomercialmkt.vercel.app/api/public/sync/clickmassa?startPage=1&maxPages=50" \
            -H "Authorization: Bearer $SYNC_CRON_TOKEN"
