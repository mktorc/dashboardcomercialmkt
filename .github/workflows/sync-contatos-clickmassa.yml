name: Sincronizar contatos (ClickMassa)

on:
  schedule:
    # De hora em hora (minuto 22): percorre TODAS as páginas de contatos em blocos de 100.
    # A listagem do ClickMassa não vem ordenada por data, então ler só as primeiras páginas
    # deixa contatos novos sem conexão (e o funil do Google subconta os contatos).
    - cron: '22 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-contatos-clickmassa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Chamar a sincronização de contatos (todas as páginas)
        env:
          SYNC_CRON_TOKEN: ${{ secrets.SYNC_CRON_TOKEN }}
        run: |
          page=1
          while [ -n "$page" ]; do
            res=$(curl --fail-with-body -sS -m 540 -X POST \
              "https://dashboardcomercialmkt.vercel.app/api/public/sync/clickmassa?startPage=$page&maxPages=100" \
              -H "Authorization: Bearer $SYNC_CRON_TOKEN")
            echo "página $page: $(echo "$res" | jq -c '{synced, withConnection, nextPage}')"
            page=$(echo "$res" | jq -r '.nextPage // empty')
          done
