name: Sincronizar oportunidades (ClickMassa)

on:
  schedule:
    # A cada 30 min: o webhook do ClickMassa não avisa quando uma tarefa é criada,
    # então total_tasks (usado em "Oportunidades sem tarefas") só se atualiza por esta sincronização.
    # Minutos 7 e 37 (não :00/:30, os mais disputados, que o GitHub mais pula). Se mesmo assim pular,
    # o Monitor dos dados de precificação dispara esta rotina quando ela passa de 2 h sem rodar.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'ID inicial (opcional; vazio = só as recentes)'
        required: false
      to:
        description: 'ID final (opcional; no máximo 5000 IDs de faixa)'
        required: false

concurrency:
  group: sync-oportunidades-clickmassa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a sincronização de oportunidades
        env:
          SYNC_CRON_TOKEN: ${{ secrets.SYNC_CRON_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          curl --fail-with-body -sS -m 540 -X POST \
            "https://dashboardcomercialmkt.vercel.app/api/public/sync/clickmassa-opportunities?from=${FROM}&to=${TO}" \
            -H "Authorization: Bearer $SYNC_CRON_TOKEN"
