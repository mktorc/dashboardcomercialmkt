name: Sincronizar oportunidades antigas (ClickMassa)

on:
  schedule:
    # Diário, ~2h40 de Brasília. A sincronização de 30 em 30 min só lê as ~1.900 oportunidades mais
    # recentes; esta varre todas para manter atualizado o contador de tarefas atrasadas (delayed_tasks)
    # das antigas, usado em "Oportunidades com tarefa em atraso".
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: sync-oportunidades-clickmassa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Varrer todas as faixas de IDs
        env:
          SYNC_CRON_TOKEN: ${{ secrets.SYNC_CRON_TOKEN }}
        run: |
          # De 1.500 em 1.500 IDs (cada chamada lê ~2 min) até uma faixa sem nenhuma oportunidade.
          from=2900
          while [ $from -lt 100000 ]; do
            to=$((from + 1499))
            # Faixa vazia (além da última oportunidade) volta HTTP 502 com found 0: é o fim da varredura.
            res=$(curl -sS -m 540 -X POST \
              "https://dashboardcomercialmkt.vercel.app/api/public/sync/clickmassa-opportunities?from=${from}&to=${to}" \
              -H "Authorization: Bearer $SYNC_CRON_TOKEN")
            echo "$from-$to $res"
            found=$(echo "$res" | jq -r '.found // empty' 2>/dev/null)
            [ -z "$found" ] && { echo "Resposta inválida"; exit 1; }
            [ "$found" = "0" ] && break
            from=$((to + 1))
          done
