# Coleta diária de cotações públicas de concorrentes (scripts/precificacao/coletor.py), sem depender de computador ligado.
# Requer os segredos do repositório SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and variables > Actions).
# A fonte florida também requer FLORIDA_NOME e FLORIDA_WHATSAPP (contato real da equipe: o site pede nome e WhatsApp para cotar por data).
# A fonte discovercars requer APIFY_TOKEN (robô pago do DiscoverCars na Apify, ~US$ 0,015 por data): roda de 3 em 3 dias.
# Duas rodadas por dia (09:00 e 21:00 UTC), com o início das datas deslocado em 3 dias: cada data de retirada é recoletada a cada 3 ou 4 dias
# em vez de 7. Assim uma rodada perdida (o agendador do GitHub atrasa e pula) ainda deixa a cotação dentro dos 9 dias que a tela aceita.
# A rodada das 21:00 e a de reposição do monitor nunca rodam o DiscoverCars (pago).
name: Coleta de concorrentes
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths:
      - 'scripts/precificacao/coletor.py'
      - 'scripts/precificacao/mapa_categorias.json'
      - '.github/workflows/coleta-concorrentes.yml'
  workflow_dispatch:
    inputs:
      retirada:
        description: "Período exato (opcional): data de retirada AAAA-MM-DD"
        required: false
      devolucao:
        description: "Período exato (opcional): data de devolução AAAA-MM-DD"
        required: false
      inicio:
        description: "Início das retiradas semanais AAAA-MM-DD (opcional; padrão hoje + 3 dias). Usado pelo monitor para repor datas vencidas"
        required: false
      sem_discovercars:
        description: "Pular o DiscoverCars (pago por busca na Apify)"
        type: boolean
        default: false
concurrency:
  group: coleta-concorrentes
  cancel-in-progress: false
jobs:
  coletar:
    name: Coletar (${{ matrix.fonte }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Uma fonte por job: se uma falha ou demora, as outras seguem e cada uma tem o seu próprio limite de tempo.
      # Avis e Budget (avislac/budgetlac) ficam de fora: bloqueiam os IPs do GitHub e voltam 0 categorias.
      fail-fast: false
      matrix:
       fonte: [nosso, up, ally, florida, national, alamo, discovercars]
    steps:
      # DiscoverCars é pago por busca (Apify): para caber nos US$ 5 grátis por mês, roda só de 3 em 3 dias no agendamento
      # (~10 x 26 datas x US$ 0,015 ≈ US$ 3,90/mês), nunca no push, e sempre que pedido à mão (workflow_dispatch),
      # exceto com sem_discovercars marcado.
      - name: Decidir se esta fonte roda hoje
        run: |
          if [ "${{ matrix.fonte }}" = "discovercars" ]; then
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.sem_discovercars }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "0 21 * * *" ] || [ $(( $(date -u +%s) / 86400 % 3 )) -ne 0 ]; }; }; then
              echo "PULAR=1" >> "$GITHUB_ENV"; echo "DiscoverCars: hoje não (roda de 3 em 3 dias)."
            fi
          fi
      - if: ${{ env.PULAR != '1' }}
        uses: actions/checkout@v4
      - if: ${{ env.PULAR != '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ env.PULAR != '1' }}
        run: pip install playwright && playwright install --with-deps chromium
      # 26 semanas (~D-185): cobre o horizonte de 180 dias da ocupação. O início desloca 1 dia da semana por dia, então em 7 dias
      # todas as datas entram na janela de 7 dias usada na comparação de preço.
      # Sem período exato: coleta padrão (7 diárias por retirada). Com período exato (pedido na tela de Competitividade): só os
      # concorrentes, uma cotação retirada→devolução. A nossa tarifa fica de fora: ela é gravada por data e somada noite a noite.
      # Início das datas: rodada das 21:00 = hoje + 6 dias (3 dias de diferença da das 09:00, que usa hoje + 3); reposição = a data pedida.
      - name: Definir o início das datas
        if: ${{ env.PULAR != '1' }}
        env:
          INICIO_PEDIDO: ${{ inputs.inicio }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          INICIO=""
          if [ -n "$INICIO_PEDIDO" ]; then
            [[ "$INICIO_PEDIDO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "inicio inválido: $INICIO_PEDIDO"; exit 1; }
            INICIO="$INICIO_PEDIDO"
          elif [ "$AGENDA" = "0 21 * * *" ]; then
            INICIO=$(date -u -d '+6 days' +%F)
          fi
          echo "INICIO_ARG=${INICIO:+--inicio $INICIO}" >> "$GITHUB_ENV"
          echo "Início das datas: ${INICIO:-padrão (hoje + 3 dias)}"
      - if: ${{ env.PULAR != '1' && (!inputs.retirada || !inputs.devolucao) }}
        run: python scripts/precificacao/coletor.py ${{ matrix.fonte }} --gravar --semanas 26 $INICIO_ARG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLORIDA_NOME: ${{ secrets.FLORIDA_NOME }}
          FLORIDA_WHATSAPP: ${{ secrets.FLORIDA_WHATSAPP }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - if: ${{ env.PULAR != '1' && inputs.retirada && inputs.devolucao && matrix.fonte != 'nosso' }}
        run: python scripts/precificacao/coletor.py ${{ matrix.fonte }} --gravar --retirada "$RETIRADA" --devolucao "$DEVOLUCAO"
        env:
          RETIRADA: ${{ inputs.retirada }}
          DEVOLUCAO: ${{ inputs.devolucao }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLORIDA_NOME: ${{ secrets.FLORIDA_NOME }}
          FLORIDA_WHATSAPP: ${{ secrets.FLORIDA_WHATSAPP }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
